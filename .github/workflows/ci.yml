# Releasing:
#   1. Set the same version in pixi.toml, the newest versioned CHANGELOG.md
#      section and include/hulud/plugin_api.h, then merge into main.
#   2. In Actions > CI > Run workflow, select main.
# The manual run checks the version, builds and tests the plugin, then tags
# the tested commit and publishes the release notes and both plugin archives.
# Pushes and pull requests only build and test; Unreleased notes are allowed.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Serialize manual releases without cancelling one already in progress.
# Normal CI runs each get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Run the release workflow from main." >&2
            exit 1
          fi

      - name: Check out release source and tags
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check release versions
        if: github.event_name == 'workflow_dispatch'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG=$(python3 scripts/check-release.py)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    container: ghcr.io/prefix-dev/pixi:0.75.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cache pixi environment and static HDF5
        uses: actions/cache@v6
        with:
          path: |
            .pixi/
            .deps/
          key: linux-x86_64-pixi-0.75.0-${{ hashFiles('pixi.lock', 'scripts/build-static-hdf5.sh') }}

      - name: Build, check portability and run tests
        run: pixi run --locked test-prod

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hulud-linux-x86_64
          retention-days: 7
          path: |
            build-prod/hulud-plugin.so
            build-prod/benchmark

  release:
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && needs.prepare.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_NAME: hulud-${{ needs.prepare.outputs.release_tag }}-linux-x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: hulud-linux-x86_64
          path: build-prod/

      - name: Recheck release versions and prepare notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/check-release.py

      - name: Package plugin and licenses
        run: |
          mkdir "$RELEASE_NAME"
          cp build-prod/hulud-plugin.so LICENSE THIRD_PARTY_NOTICES "$RELEASE_NAME/"
          tar -czf "$RELEASE_NAME.tar.gz" "$RELEASE_NAME"
          cp "$RELEASE_NAME.tar.gz" hulud-linux-x86_64.tar.gz

      - name: Tag tested commit and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/git/refs" --method POST \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" "$RELEASE_NAME.tar.gz" hulud-linux-x86_64.tar.gz \
            --verify-tag \
            --title "Hulud $RELEASE_TAG" \
            --notes-file release_notes.md
