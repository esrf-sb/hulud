[workspace]
name = "durin"
version = "1.4.4"
authors = ["Ludovic Broche <ludovic.broche@esrf.fr>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Toolchain
c-compiler = "*"
fortran-compiler = "*"
make = "*"
sysroot_linux-64 = "*"

# Runtime / libs
hdf5 = "*"
zlib = "*"
libgomp = "*"

# Dev tools
valgrind = "*"
pkg-config = "*"
libcurl = ">=8.18.0,<9"
cmake = ">=4.2.3,<5"

[tasks]
build = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"
test = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j && ctest --test-dir build --output-on-failure"
clean = "cmake --build build --target clean"
format = "cmake --build build --target format"