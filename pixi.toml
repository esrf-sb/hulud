[workspace]
name = "hulud"
version = "2.0.0"
authors = ["DAU DEV <dau-pydev@esrf.fr>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
# Toolchain
c-compiler = "*"
fortran-compiler = "*"
make = "*"
# Pinned: the distributed plugin must load on glibc >= 2.28 (RHEL/Rocky 8+).
sysroot_linux-64 = "2.28.*"

# Runtime / libs
hdf5 = "*"
zlib = "*"
libgomp = "*"

# Dev tools
valgrind = "*"
pkg-config = "*"
libcurl = ">=8.18.0,<9"
curl = "*"
patchelf = "*"
cmake = ">=4.2.3,<5"

[tasks]
build = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"
test = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j && ctest --test-dir build --output-on-failure"
build-prod = "bash scripts/build-prod.sh"
test-prod = "bash scripts/build-prod.sh && ctest --test-dir build-prod --output-on-failure"
clean = "cmake --build build --target clean"
format = "cmake --build build --target format"
