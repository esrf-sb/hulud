stages:
  - build
  - upload
  - release

variables:
  # Generic package registry location of the released plugin (tag pipelines only).
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/hulud/${CI_COMMIT_TAG}/hulud-plugin-${CI_COMMIT_TAG}-linux-x86_64.so"

# Release pipelines run on tags like v2.0.0.
.release-rules:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Builds the portable plugin with the pinned pixi toolchain (glibc >= 2.28),
# checks it (scripts/check-portable.sh, run by build-prod.sh) and runs the tests.
build:
  stage: build
  image: ghcr.io/prefix-dev/pixi:0.75.0
  cache:
    key:
      files:
        - pixi.lock
        - scripts/build-static-hdf5.sh
    paths:
      - .pixi/
      - .deps/
  script:
    - pixi run --locked test-prod
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build-prod/hulud-plugin.so
      - build-prod/benchmark

# CI artifacts expire, so the released plugin is stored in the package registry.
upload:
  stage: upload
  extends: .release-rules
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  needs: [build]
  script:
    - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file build-prod/hulud-plugin.so "${PACKAGE_URL}"'

# Creates the GitLab Release; its description is the matching CHANGELOG.md section.
release:
  stage: release
  extends: .release-rules
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [upload]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - awk -v v="${VERSION}" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > release_notes.md
    - test -s release_notes.md || { echo "CHANGELOG.md has no section '## [${VERSION}]'" >&2; exit 1; }
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Hulud $CI_COMMIT_TAG"
    description: release_notes.md
    assets:
      links:
        - name: "hulud-plugin-${CI_COMMIT_TAG}-linux-x86_64.so"
          url: $PACKAGE_URL
          link_type: package
