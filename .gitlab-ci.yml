stages:
  - build

variables:
  DEBIAN_FRONTEND: noninteractive

image: ubuntu:24.04

before_script:
  - apt-get update -q
  - apt-get install -y --no-install-recommends build-essential cmake pkg-config zlib1g-dev curl wget file ca-certificates
  - rm -rf /var/lib/apt/lists/*

build:
  stage: build
  script:
    - bash scripts/build-prod.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build-prod/hulud-plugin.so
      - build-prod/benchmark
