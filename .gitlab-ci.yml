stages:
  - build

variables:
  DEBIAN_FRONTEND: noninteractive

image: ubuntu:24.04

before_script:
  - apt-get update -q
  - apt-get install -y --no-install-recommends build-essential cmake libhdf5-dev pkg-config zlib1g-dev
  - rm -rf /var/lib/apt/lists/*

build:
  stage: build
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    - cmake --build build -j"$(nproc)"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/durin-plugin.so
      - build/benchmark
